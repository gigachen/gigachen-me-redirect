<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>TapTap has moved</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8ff;color:#13235a;font:16px Arial,sans-serif}main{max-width:460px;padding:32px}h1{font-size:36px;letter-spacing:-.05em}p{line-height:1.6}a{color:#183ba8;font-weight:bold}</style>
</head>
<body>
  <main><h1>TapTap has moved.</h1><p>Opening the same page at our new address.</p><a id="destination" href="https://tap-tap.live/">Continue to TapTap →</a><noscript><p>Enable JavaScript to preserve the original page address, or use the link above.</p></noscript></main>
  <script>
    const destination = 'https://tap-tap.live' + location.pathname + location.search + location.hash;
    document.getElementById('destination').href = destination;
    location.replace(destination);
  </script>
</body>
</html>
